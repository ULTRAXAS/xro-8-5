<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Xro 8.5">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1488FB"/>
      <stop offset="45%" stop-color="#0AADFB"/>
      <stop offset="100%" stop-color="#623EFA"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A1CFB"/>
      <stop offset="50%" stop-color="#623EFA"/>
      <stop offset="100%" stop-color="#1488FB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <!-- swirling circular frame -->
  <g fill="none" stroke="url(#brand)" stroke-linecap="round" filter="url(#glow)">
    <circle cx="512" cy="512" r="390" stroke-width="28" opacity="0.95"/>
    <circle cx="512" cy="512" r="360" stroke-width="10" opacity="0.55" stroke="url(#brandSoft)"/>
    <path d="M160 470 C220 250, 420 150, 620 190 C820 230, 900 420, 860 600" stroke-width="18" opacity="0.75"/>
    <path d="M860 540 C800 760, 600 880, 400 840 C200 800, 120 600, 170 430" stroke-width="18" opacity="0.75" stroke="url(#brandSoft)"/>
  </g>
  <!-- mark + wordmark -->
  <g transform="translate(512 512)">
    <!-- interlaced X / knot -->
    <g transform="translate(-210 -10)" filter="url(#glow)">
      <path d="M20 -70 C70 -110, 130 -100, 160 -50 C190 0, 170 60, 120 85 C70 110, 10 90, -10 40 C-30 -10, -20 -50, 20 -70 Z"
            fill="none" stroke="url(#brand)" stroke-width="22"/>
      <path d="M160 -70 C110 -110, 50 -100, 20 -50 C-10 0, 10 60, 60 85 C110 110, 170 90, 190 40 C210 -10, 200 -50, 160 -70 Z"
            fill="none" stroke="url(#brandSoft)" stroke-width="22"/>
      <path d="M40 -20 C80 -55, 130 -45, 145 -5 C160 35, 130 70, 90 75 C50 80, 15 50, 20 10 C25 -20, 20 -10, 40 -20 Z"
            fill="url(#brand)" opacity="0.95"/>
    </g>
    <!-- divider -->
    <line x1="-40" y1="-70" x2="-40" y2="70" stroke="url(#brand)" stroke-width="6" stroke-linecap="round"/>
    <!-- wordmark -->
    <text x="-10" y="18" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700">
      <tspan fill="#111111">Xro </tspan>
      <tspan fill="url(#brand)">8.5</tspan>
    </text>
  </g>
</svg>
